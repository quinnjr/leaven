packages:
  - 'packages/*'
  - 'docs'

# GHSA-96hv-2xvq-fx4p (high): memory-exhaustion DoS in `ws` from tiny
# fragments and data chunks. Fixed in 8.21.0 and 7.5.11.
#
# `ws` reaches us transitively through @nestjs/graphql (directly and via
# graphql-ws), so it cannot be moved by editing a dependency range.
#
# These belong here rather than under a "pnpm" key in package.json: pnpm 10
# stopped reading that field, and ignores it with only a warning — overrides
# declared there look applied but silently are not.
overrides:
  # magic-string >= 1.4 (via @angular/build 22.2) imports encodeRangeMappings,
  # added in sourcemap-codec 1.6; older resolutions break the docs build.
  '@jridgewell/sourcemap-codec': '^1.6.0'
  'ws@>=8.0.0 <8.21.0': '^8.21.1'
  'ws@>=7.0.0 <7.5.11': '^7.5.11'
  # GHSA-5p4m-2wfm-xmqj / GHSA-2883-xcg3-v3hh (high): CPU exhaustion in js-yaml
  # merge-key and !!omap handling. Fixed in 4.3.2 and 3.15.2; js-yaml only
  # reaches us transitively (lint/docs tooling).
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  'js-yaml@>=3.0.0 <3.15.2': '^3.15.2'
  # High/critical advisories reported by `pnpm audit`, all reaching us
  # transitively through dev tooling (eslint, changesets, commitlint, docs)
  # or the nestjs package's dev-only @nestjs/platform-express. None of these
  # are dependencies of the published packages.
  'brace-expansion@<1.1.20': '^1.1.20'
  'brace-expansion@>=4.0.0 <5.0.11': '^5.0.11'
  'fast-uri@>=3.0.0 <3.1.7': '^3.1.7'
  'flatted@<3.4.2': '^3.4.2'
  'minimatch@<3.1.4': '^3.1.4'
  'multer@<2.3.0': '^2.3.0'
  'path-to-regexp@>=8.0.0 <8.4.0': '^8.4.0'
  'proxy-addr@<2.0.8': '^2.0.8'
  'source-map-js@>=1.0.0 <1.2.2': '^1.2.2'
  'undici@>=8.0.0 <8.10.2': '^8.10.2'
  # GHSA-7mx3-vvmw-hjmv (high): prototype pollution in mergeDeep. Reaches us
  # via @nestjs/graphql and @graphql-tools/schema (nestjs package).
  '@graphql-tools/utils@<=12.0.0': '^12.0.1'

# Dependencies allowed to run install scripts (pnpm 10 skips any not listed).
# All three come in through the docs site's Angular build: native file
# watching and the build cache's LMDB store and msgpack codec.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - lmdb
  - msgpackr-extract
