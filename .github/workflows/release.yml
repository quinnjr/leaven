name: Release

# git-flow release model.
#
# Changesets accumulate on `develop` as features merge. This workflow splits
# the two halves of a changesets release so each runs on the branch it belongs
# to:
#
#   develop -> version:  opens the "chore: version packages" PR against
#                        `develop`, applying pending changesets to package
#                        versions and CHANGELOGs. Never publishes.
#   main    -> publish:  publishes the versions `main` carries and tags the
#                        release. Never opens a version PR.
#
# The promotion between them is the git-flow release branch: once the version
# PR has merged into `develop`, cut `release/*` from `develop` and merge it
# into `main`, which triggers the publish job.
#
# Each changesets/action invocation is given only ONE of `version-script:` /
# `publish-script:` — that is what constrains it to a single behaviour per branch.
# Giving it both (the previous configuration) is why a push to `main` opened a
# version PR against `main`, bypassing `develop` entirely.

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

jobs:
  version:
    name: Version packages (develop)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # changesets/action@v2 pairs with @changesets/cli v3 (v1 pairs with
      # CLI v2 and cannot read v3's publish output). The token defaults to
      # this job's GITHUB_TOKEN.
      - name: Create version pull request
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

  publish:
    name: Publish packages (main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check built packages
        run: pnpm check:dist

      - name: Run tests
        run: pnpm test

      # npm trusted publishing (OIDC): no NPM_TOKEN. The npm CLI exchanges this
      # job's GitHub OIDC token (`id-token: write` above) for a short-lived
      # publish token, per package, against the trusted publisher configured
      # on npmjs.com (repo quinnjr/leaven, workflow release.yml). Provenance
      # is generated automatically. pnpm 10 hands the upload to the `npm` on
      # PATH, which must be >= 11.5.1 for OIDC; Node 24 bundles one.
      - name: Check npm supports trusted publishing
        run: |
          v=$(npm --version)
          echo "npm $v"
          [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -1)" = 11.5.1 ] || {
            echo "::error::npm $v is older than 11.5.1 and cannot publish via OIDC"
            exit 1
          }

      # v2 reads CLI v3's publish output, then pushes the release tags and
      # creates the GitHub releases. Under v1 + CLI v3 it published to npm
      # but saw nothing, so no tags or releases were made (0.5.0).
      - name: Publish to npm
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
